<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر اقساط و هزینه‌ها</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D6B5F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر اقساط">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0EE;--surface:#FFFFFF;--surface2:#F3F7F6;--ink:#13303A;--muted:#5A6F77;--line:#D3DDDA;
  --accent:#0D6B5F;--accent-ink:#FFFFFF;--accent-soft:#D5EBE6;
  --late:#B5302A;--late-soft:#F8E1DE;--soon:#A86B12;--soon-soft:#F7ECD7;--paid:#2C7A4C;--paid-soft:#DCEFE2;
  --tile:#E1E9E6;--tile-fill:#B8DCD3;
  --t-loan:#0D6B5F;--t-cheque:#4656B0;--t-buy:#8A4F9C;--t-debt:#A2611F;
  --kufi:"Reem Kufi","Vazirmatn",Tahoma,sans-serif;
  --body:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E191C;--surface:#16252A;--surface2:#1C2E34;--ink:#E3EEEB;--muted:#93A8AE;--line:#2A3E44;
    --accent:#45B8A6;--accent-ink:#052019;--accent-soft:#183F3A;
    --late:#F0796C;--late-soft:#3D2120;--soon:#E5B04F;--soon-soft:#3A2F17;--paid:#64CB8F;--paid-soft:#173426;
    --tile:#1F3238;--tile-fill:#24564E;
    --t-loan:#45B8A6;--t-cheque:#8C9AF0;--t-buy:#C690D6;--t-debt:#E1A260;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E191C;--surface:#16252A;--surface2:#1C2E34;--ink:#E3EEEB;--muted:#93A8AE;--line:#2A3E44;
  --accent:#45B8A6;--accent-ink:#052019;--accent-soft:#183F3A;
  --late:#F0796C;--late-soft:#3D2120;--soon:#E5B04F;--soon-soft:#3A2F17;--paid:#64CB8F;--paid-soft:#173426;
  --tile:#1F3238;--tile-fill:#24564E;
  --t-loan:#45B8A6;--t-cheque:#8C9AF0;--t-buy:#C690D6;--t-debt:#E1A260;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;max-width:760px;margin:0 auto}
.brand{font-family:var(--kufi);font-size:24px;font-weight:700;letter-spacing:0;line-height:1.2}
.brand small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:99px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--soon);display:inline-block}
.sync.cloud i{background:var(--paid)} .sync.error i{background:var(--late)}
h2{font-family:var(--kufi);font-weight:700;font-size:19px;margin:26px 0 10px;line-height:1.4}
h3{font-size:15px;margin:0;font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* this-month ledger */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin-top:6px}
.ledger .title{font-family:var(--kufi);font-size:17px}
.ledger .rows{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.ledger .rows div{display:flex;flex-direction:column}
.ledger .rows span{font-size:12px;color:var(--muted)}
.ledger .rows b{font-size:17px;font-weight:800}
.ledger .rows .rem b{color:var(--accent)}
.bar{height:8px;background:var(--tile);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--late-soft);color:var(--late);border-radius:14px;padding:12px 14px;margin-top:12px;border:0;width:100%;text-align:right;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:right}
button.stat{width:100%}
.stat span{font-size:12px;color:var(--muted);display:block}
.stat b{font-size:17px;font-weight:800;display:block;line-height:1.5}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}

/* year strip: the memorable element */
.yearhead{display:flex;align-items:center;justify-content:space-between}
.yearnav{display:flex;gap:6px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:12px;font-size:18px;line-height:1}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:560px){.months{grid-template-columns:repeat(6,1fr)}}
.month{position:relative;overflow:hidden;border:1px solid transparent;background:var(--tile);border-radius:14px;padding:10px 10px 12px;min-height:96px;text-align:right;display:flex;flex-direction:column;justify-content:space-between}
.month .fill{position:absolute;inset:auto 0 0 0;background:var(--tile-fill);transition:height .5s ease}
.month > *:not(.fill){position:relative}
.month .mn{font-family:var(--kufi);font-size:15px}
.month .amt{font-weight:800;font-size:14px}
.month .sub{font-size:11px;color:var(--muted)}
.month.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.month.late .sub{color:var(--late);font-weight:700}
.month.empty .amt{color:var(--muted);font-weight:500}
.yeartot{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;margin-top:10px;color:var(--muted)}
.yeartot b{color:var(--ink)}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:right}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted)}
.row .end{text-align:left;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.late{background:var(--late-soft);color:var(--late)}
.chip.soon{background:var(--soon-soft);color:var(--soon)}
.chip.paid{background:var(--paid-soft);color:var(--paid)}
.chip.part{background:var(--soon-soft);color:var(--soon)}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
.empty-state button{margin-top:10px}

/* debt cards */
.dcard{display:block;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 14px;margin-bottom:10px;border-right:5px solid var(--c)}
.dcard .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dcard .t{font-weight:800;font-size:16px}
.dcard .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 8px}
.dcard .grid span{display:block;font-size:11px;color:var(--muted)}
.dcard .grid b{font-size:14px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;white-space:nowrap;font-size:13px}
.fbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* buttons */
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--late-soft);color:var(--late)}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btns .btn{flex:1}
.fab{position:fixed;left:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--accent);color:var(--accent-ink);border:0;border-radius:18px;padding:13px 18px;font-weight:800;font-size:15px;box-shadow:0 6px 18px rgba(13,107,95,.35)}

/* bottom nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:flex;max-width:760px;margin:0 auto}
nav.tabs a{flex:1;text-align:center;padding:8px 4px 9px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a.on{color:var(--accent)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(5,20,22,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.month .fill{transition:none}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin:4px 0 12px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shead h2{margin:4px 0 8px}
label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
.inp{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:16px}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:8px}
.hint{font-size:12px;color:var(--accent);min-height:1em;margin-top:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:14px;background:var(--surface2);cursor:pointer}
.seg input:checked + label{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible + label{outline:2px solid var(--accent)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.kv div{background:var(--surface2);border-radius:12px;padding:8px 12px}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-size:15px}
.sched .row{padding:10px 12px}
.idx{width:30px;height:30px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.idx.paid{background:var(--paid-soft);color:var(--paid)}
.idx.late{background:var(--late-soft);color:var(--late)}
.catbars .cb{margin-bottom:10px}
.catbars .cb div{display:flex;justify-content:space-between;font-size:13px}
.monthnav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;margin-top:6px}
.monthnav b{font-family:var(--kufi);font-size:17px}
.bigtotal{font-size:26px;font-weight:800;margin:10px 0 2px}
.daygroup{font-size:12px;color:var(--muted);padding:10px 14px 4px;background:var(--surface2);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{font-size:13px;padding:4px 10px;display:inline-flex;gap:6px;align-items:center}
.chips .chip button{border:0;background:none;padding:0;color:var(--late);font-weight:800}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card p{margin:0 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:12px;z-index:30;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
textarea.inp{min-height:120px;font-size:12px;direction:ltr}
.sectionlink{border:0;background:none;color:var(--accent);font-weight:700;padding:0}
.right-note{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">دفتر اقساط<small id="todayLbl"></small></div>
  <div class="sync" id="sync"><i></i><span>ذخیره روی همین دستگاه</span></div>
</header>
<main class="wrap" id="view"></main>
<button class="fab" id="fab">+ افزودن</button>
<nav class="tabs"><div class="in">
  <a href="#home" data-v="home"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>داشبورد</a>
  <a href="#debts" data-v="debts"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M6 15h5M2 10h20"/></svg>اقساط و چک‌ها</a>
  <a href="#expenses" data-v="expenses"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>هزینه‌ها</a>
  <a href="#more" data-v="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>تنظیمات</a>
</div></nav>
<div class="overlay" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Jalali calendar ---------- */
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];const gy2=gm>2?gy+1:gy;let days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+g[gm-1];let jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);const jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const s=[0,31,(gy%4===0&&gy%100!==0)||gy%400===0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>s[gm];gm++)gd-=s[gm];return[gy,gm,gd]}
function isLeap(y){const g=j2g(y,12,30);const b=g2j(g[0],g[1],g[2]);return b[0]===y&&b[1]===12&&b[2]===30}
function jLen(y,m){return m<=6?31:m<=11?30:(isLeap(y)?30:29)}
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const now=new Date();const T=g2j(now.getFullYear(),now.getMonth()+1,now.getDate());
const TKEY=T[0]*10000+T[1]*100+T[2];const TMI=T[0]*12+T[1]-1;
const key=(y,m,d)=>y*10000+m*100+d;
const ym=mi=>[Math.floor(mi/12),mi%12+1];
function jDate(y,m,d){const g=j2g(y,m,d);return new Date(g[0],g[1]-1,g[2])}
function daysFromToday(y,m,d){const a=jDate(y,m,d),b=new Date(now.getFullYear(),now.getMonth(),now.getDate());return Math.round((a-b)/864e5)}

/* ---------- formatting ---------- */
const faN=(n,o)=>Number(n).toLocaleString('fa-IR',o);
const faY=n=>faN(n,{useGrouping:false});
const fa2=n=>faN(n,{useGrouping:false,minimumIntegerDigits:2});
const fdate=(y,m,d)=>faY(y)+'/'+fa2(m)+'/'+fa2(d);
const mlabel=(y,m)=>MN[m-1]+' '+faY(y);
function toEn(s){return String(s).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632)}
function parseMoney(s){return parseInt(toEn(s).replace(/[^\d]/g,''),10)||0}
function unit(){return state.settings.unit||'تومان'}
function money(n){return faN(Math.round(n))+' '+unit()}
function compact(n){n=Math.round(n);const a=Math.abs(n);if(a>=1e9)return faN(n/1e9,{maximumFractionDigits:2})+' میلیارد';if(a>=1e6)return faN(n/1e6,{maximumFractionDigits:1})+' میلیون';if(a>=1e3)return faN(n/1e3,{maximumFractionDigits:0})+' هزار';return faN(n)}
function parseJ(s){const p=toEn(s).trim().split(/[\/\-\.\s]+/).map(Number);if(p.length!==3||p.some(isNaN))return null;let[y,m,d]=p;if(y<100)y+=1400;if(m<1||m>12||d<1||d>jLen(y,m))return null;return[y,m,d]}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- state ---------- */
const DEF_CATS=['خوراک و خواربار','حمل‌ونقل و سوخت','قبوض','خرید منزل','درمان','آموزش','پوشاک','تفریح و رستوران','سایر'];
const TYPES={loan:{n:'وام',c:'--t-loan'},cheque:{n:'چک',c:'--t-cheque'},buy:{n:'خرید اقساطی',c:'--t-buy'},debt:{n:'بدهی شخصی',c:'--t-debt'}};
const LS='daftar-aqsat-v1';
function fresh(){return{v:1,updatedAt:0,debts:[],expenses:[],settings:{income:0,unit:'تومان',theme:'auto',cats:DEF_CATS.slice()}}}
let state=fresh();

/* ---------- debt math ---------- */
function insts(d){
  const out=[];const start=d.sy*12+d.sm-1;
  for(let i=0;i<d.count;i++){
    const ev=d.every||1;const base=start+i*ev;const bym=ym(base);const ov=d.dates&&d.dates[i];
    const y=ov?ov[0]:bym[0],m=ov?ov[1]:bym[1],day=ov?ov[2]:Math.min(d.day,jLen(y,m)),mi=y*12+m-1;
    const amt=d.amounts&&d.amounts[i]!=null?d.amounts[i]:d.amt;
    const p=d.pays&&d.pays[i];const pa=p?p.a:0;const done=pa>=amt;
    const k=key(y,m,day);const dd=daysFromToday(y,m,day);
    const status=done?'paid':k<TKEY?'late':dd<=7?'soon':'up';
    out.push({d,i,mi,y,m,day,k,amt,moved:!!ov,pa,pd:p?p.d:null,rem:Math.max(0,amt-pa),done,partial:pa>0&&!done,status,dd});
  }
  return out;
}
function stats(d){
  const L=insts(d);let total=0,paid=0,rem=0,remCount=0,late=0;let next=null;
  for(const x of L){total+=x.amt;paid+=Math.min(x.pa,x.amt);rem+=x.rem;if(!x.done){remCount++;if(!next||x.k<next.k)next=x;if(x.status==='late')late++}}
  return{L,total,paid,rem,remCount,paidCount:L.length-remCount,late,next,endMi:Math.max(...L.map(x=>x.mi))};
}
function allInsts(){return state.debts.flatMap(insts)}
function statusChip(x){
  if(x.done)return'<span class="chip paid">پرداخت شد</span>';
  if(x.status==='late')return'<span class="chip late">معوق'+(x.partial?' (ناقص)':'')+'</span>';
  if(x.partial)return'<span class="chip part">پرداخت ناقص</span>';
  if(x.status==='soon')return'<span class="chip soon">'+(x.dd===0?'امروز':faN(x.dd)+' روز دیگر')+'</span>';
  return'<span class="chip">در انتظار</span>';
}

/* ---------- files ---------- */
async function saveFile(filename,data){
  try{const blob=new Blob([data],{type:filename.endsWith('.ics')?'text/calendar;charset=utf-8':'application/json;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true}catch(e){return false}
}
async function exportBackup(){
  const name='daftar-aqsat-'+T.join('-')+'.json';const txt=JSON.stringify(state);
  const ok=await saveFile(name,txt);
  const bk=document.getElementById('bk');
  if(!ok&&bk){bk.innerHTML='<p class="muted" style="font-size:13px;margin-top:10px">دریافت فایل اینجا ممکن نشد. متن زیر را کپی کنید و جایی نگه دارید:</p><textarea class="inp" readonly>'+esc(txt)+'</textarea>'}
}
function importBackup(ev){
  const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const p=JSON.parse(r.result);if(!Array.isArray(p.debts))throw 0;if(!confirm('اطلاعات فعلی با فایل پشتیبان جایگزین شود؟'))return;
    const ys=new Set(state.expenses.map(e=>e.y));state=Object.assign(fresh(),p);state.settings=Object.assign(fresh().settings,p.settings||{});state.expenses.forEach(e=>ys.add(e.y));applyTheme();commit([...ys]);toast('بازیابی انجام شد')}catch(e){toast('این فایل پشتیبان معتبر نیست')}};
  r.readAsText(f);
}
async function exportIcs(d){
  const pad=n=>String(n).padStart(2,'0');const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  let s='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//daftar-aqsat//fa\r\nCALSCALE:GREGORIAN\r\n';
  insts(d).filter(x=>!x.done).forEach(x=>{const g=j2g(x.y,x.m,x.day);const g2=new Date(g[0],g[1]-1,g[2]+1);
    s+='BEGIN:VEVENT\r\nUID:'+d.id+'-'+x.i+'@daftar\r\nDTSTAMP:'+stamp+'\r\nDTSTART;VALUE=DATE:'+g[0]+pad(g[1])+pad(g[2])+'\r\nDTEND;VALUE=DATE:'+g2.getFullYear()+pad(g2.getMonth()+1)+pad(g2.getDate())+'\r\nSUMMARY:'+(d.type==='cheque'?'سررسید چک ':'قسط ')+d.title.replace(/[,;\\]/g,' ')+' - '+x.amt.toLocaleString('en-US')+' '+unit()+'\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:یادآور قسط\r\nTRIGGER:-PT15H\r\nEND:VALARM\r\nEND:VEVENT\r\n'});
  s+='END:VCALENDAR\r\n';
  const ok=await saveFile('aqsat-'+d.id+'.ics',s);
  toast(ok?'فایل تقویم آماده شد؛ آن را باز کنید تا به تقویم اضافه شود':'دریافت فایل در این نما ممکن نیست');
}

/* ---------- boot ---------- */
function applyTheme(){const t=state.settings.theme;if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
function route(){const h=location.hash.replace('#','');current=['home','debts','expenses','more'].includes(h)?h:'home';closeSheet();render();window.scrollTo(0,0)}
document.getElementById('todayLbl').textContent='امروز '+faN(T[2])+' '+MN[T[1]-1]+' '+faY(T[0]);
window.addEventListener('hashchange',route);
applyTheme();route();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
